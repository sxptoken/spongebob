<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101216">
  <title>Secret Web — Access</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    :root{color-scheme:dark}
    html{min-height:100%;background:#101216}
    body{position:relative;isolation:isolate;display:grid;place-items:center;min-height:100vh;margin:0;padding:24px;overflow:hidden;background:#101216;color:#eef0f3;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
    body:before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;background:radial-gradient(ellipse at 50% 18%,rgba(148,156,170,.17),transparent 38%),radial-gradient(ellipse at 12% 88%,rgba(75,83,98,.13),transparent 40%),linear-gradient(180deg,#101216 0%,#0b0d11 100%)}
    body:after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:radial-gradient(rgba(255,255,255,.2) 1px,transparent 1px),radial-gradient(rgba(148,156,170,.16) 1px,transparent 1px);background-size:46px 46px,73px 73px;background-position:0 0,30px 20px;opacity:.16}
    .login-shell{width:min(440px,100%);position:relative}
    .login-glow{position:absolute;inset:-48px;border-radius:48px;background:radial-gradient(ellipse,rgba(148,156,170,.13),transparent 70%);filter:blur(24px);pointer-events:none}
    .login-card{position:relative;width:100%;box-sizing:border-box;padding:40px;border:1px solid rgba(148,156,170,.4);border-radius:24px;background:linear-gradient(145deg,rgba(20,22,28,.96),rgba(10,12,16,.96));box-shadow:0 25px 80px rgba(0,0,0,.5),inset 0 1px rgba(255,255,255,.055);text-align:center;backdrop-filter:blur(18px)}
    .login-brand{display:flex;justify-content:center;align-items:center;gap:9px;font-size:25px;font-weight:900;letter-spacing:-.8px;margin-bottom:24px;color:#f4f5f7}
    .login-brand .brand-star{color:#b5bdc9;font-size:27px;filter:drop-shadow(0 0 9px rgba(148,156,170,.6))}
    .login-lock{width:52px;height:52px;margin:0 auto 19px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(145deg,rgba(148,156,170,.2),rgba(148,156,170,.08));border:1px solid rgba(148,156,170,.34);color:#c2c9d3;font-size:23px;box-shadow:0 0 26px rgba(148,156,170,.12)}
    .login-card h1{margin:0 0 8px;color:#f4f5f7;font-size:28px;letter-spacing:-.8px;font-weight:850}
    .login-card p{color:#a0a6b1;margin:0 0 26px;font-size:13px;line-height:1.5}
    .login-input{display:block;width:100%;box-sizing:border-box;padding:15px 16px;border-radius:12px;border:1px solid rgba(148,156,170,.32);background:rgba(255,255,255,.045);color:#f4f5f7;outline:none;margin:0 0 12px;font:inherit;font-size:14px;transition:border-color .18s,box-shadow .18s,background .18s}
    .login-input::placeholder{color:#858b96}
    .login-input:focus{border-color:rgba(178,187,200,.8);background:rgba(255,255,255,.065);box-shadow:0 0 0 4px rgba(148,156,170,.12)}
    .login-button{width:100%;padding:15px;border:1px solid rgba(255,255,255,.12);border-radius:12px;background:linear-gradient(135deg,#a8b0bc,#747e8d);color:#fff;font:inherit;font-size:13px;font-weight:850;cursor:pointer;box-shadow:0 10px 28px rgba(0,0,0,.24);transition:transform .18s,filter .18s,box-shadow .18s}
    .login-button:hover{transform:translateY(-1px);filter:brightness(1.08);box-shadow:0 14px 34px rgba(0,0,0,.34)}
    .login-button:active{transform:translateY(0)}
    .login-error{min-height:20px;margin-top:12px;color:#ff9ca7;font-size:13px}
    @media(max-width:480px){body{padding:18px}.login-card{padding:30px 23px}.login-card h1{font-size:25px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
  </style>
  <script>window.va=window.va||function(){(window.vaq=window.vaq||[]).push(arguments)};</script>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
  <div class="login-shell"><div class="login-glow"></div><main class="login-card">
    <div class="login-brand"><span class="brand-star">✦</span><span>Secret Web</span></div>
    <div class="login-lock" aria-hidden="true">✦</div>
    <h1>Welcome back</h1>
    <p>Enter the password to continue.</p>
    <form id="loginForm">
      <input class="login-input" id="password" type="password" autocomplete="current-password" placeholder="Password" autofocus required>
      <button class="login-button" type="submit">Enter Secret Web</button>
      <div class="login-error" id="error" aria-live="polite"></div>
    </form>
  </main></div>
  <script>
    const form=document.getElementById("loginForm");
    const password=document.getElementById("password");
    const error=document.getElementById("error");
    form.addEventListener("submit",async e=>{
      e.preventDefault();
      error.textContent="";
      try{
        const response=await fetch("/api/auth",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:password.value})});
        if(response.ok){
          const params=new URLSearchParams(location.search);
          const next=params.get("next");
          location.href=next&&next.startsWith("/")&&!next.startsWith("//")?next:"/";
        }else{
          error.textContent="Incorrect password.";
          password.select();
        }
      }catch{
        error.textContent="Could not connect. Please try again.";
      }
    });
  </script>
  <script type="module" src="/announcements.js"></script>
</body>
</html>
